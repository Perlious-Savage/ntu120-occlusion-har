# Milestone 3 fusion baselines on frozen Milestone 2 branch features (scripts/train_fusion.py).
# Features come from scripts/evaluate_corruptions.py: <features_dir>/<branch run>/<split>/<condition>/
seed: 42
features_dir: outputs/m3_robustness
branch_runs: {rgb: 'r3d18_{protocol}_seed42', skeleton: 'ctrgcn_{protocol}_seed42'}
num_classes: 120

latent_dim: 256          # both branches projected to this size; fixed across all fusion experiments
dropout: 0.5
# Heads learn from the held-out validation split: the backbones fit their own training data ~100%,
# so heads trained on training features cannot learn when a branch fails. k-fold CV inside the
# validation split chooses where to stop.
train_split: val         # val (main) | train (ablation, written to <output_dir>_trainfeat)
cv_folds: 5              # class-stratified (subject-grouped folds lose whole classes in NTU-120)
epochs: 100              # maximum; CV picks the stopping epoch (the train-feature ablation uses 30)
aux_weight: 1.0          # + aux_weight * (CE(RGB aux head) + CE(skeleton aux head)); 0 = ablation (attention collapses onto RGB)
batch_size: 256
optimizer: {name: adamw, lr: 0.001, weight_decay: 0.01}
scheduler: {name: cosine}

# Clean-trained heads are tested without retraining on: clean; every RGB corruption S1-S5 with
# clean skeleton; every skeleton corruption S1-S5 with clean RGB; and these dual cases (both
# modalities corrupted independently, each with its own seed).
dual_corruptions:
  pairs: [[rgb_occlusion, skeleton_part_dropout], [rgb_blur, skeleton_noise], [rgb_temporal_mask, skeleton_joint_dropout]]
  severities: [[2, 2], [3, 3], [4, 4], [4, 1], [1, 4]]   # [RGB severity, skeleton severity]

output_dir: outputs/m3_fusion

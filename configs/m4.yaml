# Milestone 4 fusion on frozen branch outputs (scripts/m4_fusion.py, methods in src/models/m4_fusion.py).
seed: 42
features_dir: outputs/m3_robustness
branch_runs: {rgb: 'r3d18_{protocol}_seed42', skeleton: 'ctrgcn_{protocol}_seed42'}
# Validation is split once by performance (src/calibration.py val_half, review item A3): heads train on the
# 'fit' half; temperatures and selective-prediction thresholds come from the clean 'calib' half.
methods: [rgb, skeleton, average, calibrated_average, maxconf, entropy, entropy_feat, attention, moddrop, tmc,
          reliability_tcp, reliability_correct, reliability_cross_tcp, reliability_cross_correct]
trained_methods: [entropy_feat, attention, moddrop, tmc, reliability_tcp, reliability_correct, reliability_cross_tcp,
                  reliability_cross_correct]   # extra head seeds (B7 / 4.20) rerun only these
seeds: [42, 1, 2, 3, 4]
# passes over the fit half (~3.2k samples, 13 batches): 300 epochs = ~3900 steps (40 epochs = 520 steps left the
# reliability nets at their initial 0.5 / 0.5). Setting B redraws every sample's condition each epoch.
epochs: 300
batch_size: 256
optimizer: {lr: 0.001, weight_decay: 0.01}
# Setting B (4.12, review item B2): each training sample is drawn clean / RGB-corrupted / skeleton-corrupted
# with this prior, from the families NOT held out; rotation k holds out rgb[k] and skeleton[k] (in-family and
# out-of-family results reported separately). Every trained method gets the same training (B2.3).
families:
  rgb: [rgb_occlusion, rgb_blur, rgb_temporal_mask]
  skeleton: [skeleton_joint_dropout, skeleton_part_dropout, skeleton_noise]
setting_b_prior: [0.34, 0.33, 0.33]
# Mixed-condition test stream (review item B4): each test sample independently clean / RGB / skeleton / dual,
# family uniform over the three standard families of that modality, severity uniform S1-S5.
mixed_stream: {prior: [0.4, 0.2, 0.2, 0.2], seed: 7}
coverages: [1.0, 0.95, 0.9, 0.85, 0.8, 0.7, 0.6]
selective_targets: [0.9, 0.8]   # thresholds set on clean calib validation; coverage actually reached is reported (B3.3)
output_dir: results/milestone4/fusion
